[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kafka-flink-clickhouse-lab-monitoring"
version = "0.1.0"
description = "Learning-first Kafka, PyFlink, ClickHouse, and observability lab"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "PyYAML==6.0.2",
  "ruff==0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "producer", "flink"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.uv]
package = false
