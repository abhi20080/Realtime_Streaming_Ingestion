[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kafka-flink-clickhouse-lab-monitoring"
version = "0.1.0"
description = "Learning-first Kafka, PyFlink, ClickHouse, and observability lab"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "PyYAML==6.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "producer", "flink"]
addopts = "-ra"

[tool.uv]
package = false
