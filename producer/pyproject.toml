[project]
name = "kafka-flink-clickhouse-lab-producer"
version = "0.1.0"
description = "Observable telemetry generator for the Kafka/Flink/ClickHouse learning lab"
requires-python = ">=3.11"
dependencies = ["confluent-kafka==2.11.1"]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
