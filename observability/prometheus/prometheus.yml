global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
  external_labels:
    lab: kafka-flink-clickhouse-monitoring

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
        labels:
          service: prometheus

  - job_name: kafka
    static_configs:
      - targets: ["kafka:9404"]
        labels:
          service: kafka

  - job_name: flink-jobmanager
    static_configs:
      - targets: ["jobmanager:9249"]
        labels:
          service: flink-jobmanager

  - job_name: flink-taskmanager
    static_configs:
      - targets: ["taskmanager:9249"]
        labels:
          service: flink-taskmanager

  - job_name: clickhouse
    metrics_path: /metrics
    static_configs:
      - targets: ["clickhouse:9363"]
        labels:
          service: clickhouse
